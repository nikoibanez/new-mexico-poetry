name: Restore index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore site as index.html
        run: |
          git checkout ce9d60e -- new-mexico-poetry.html
          git mv new-mexico-poetry.html index.html
          git config user.name "nikoibanez"
          git config user.email "supereukarya@gmail.com"
          git commit -m "Restore New Mexico Poetry site as index.html"
          git push origin main
