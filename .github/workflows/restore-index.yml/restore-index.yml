name: Restore index.html from uploaded blob

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file to index.html
        run: |
          cp new-mexico-poetry.html index.html
          rm new-mexico-poetry.html
          git config user.name "nikoibanez"
          git config user.email "nikoibanez@users.noreply.github.com"
          git add -A
          git commit -m "Restore New Mexico Poetry site as index.html"
          git push
















